services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cmdb}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdb"]
      interval: 5s
      retries: 10

  # Только для разработки: в проде используется корпоративный IdP
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    environment:
      CMDB_DATABASE_URL: postgresql+asyncpg://cmdb:${DB_PASSWORD:-cmdb}@db:5432/cmdb
      CMDB_OIDC_ISSUER: http://localhost:8080/realms/cmdb
      CMDB_OIDC_JWKS_URL: http://keycloak:8080/realms/cmdb/protocol/openid-connect/certs
      CMDB_OIDC_AUDIENCE: cmdb-api
      CMDB_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8080/realms/cmdb
        VITE_OIDC_CLIENT_ID: cmdb-ui
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
